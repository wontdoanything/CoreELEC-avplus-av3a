name: Build CoreELEC 21.3-ng S922X

on:
  workflow_dispatch: # 允许手动点击按钮触发编译

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          ref: coreelec-21 # 确保拉取的是21版本分支

      - name: Free Disk Space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential bash bc bzip2 gcc g++ git patch textutils xz-utils zip wget cpio python3

      - name: Run CoreELEC Builder
        run: |
          # 核心命令：只编译 S922X（922芯片）需要的 Amlogic-ng 镜像
          PROJECT=Amlogic-ng ARCH=aarch64 make image

      - name: Upload Image Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CoreELEC-S922X-AV3A-Built
          path: target/*.img.gz
