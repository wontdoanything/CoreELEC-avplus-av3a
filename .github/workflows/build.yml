name: Build CoreELEC 21.3-ng S922X

on:
  workflow_dispatch: # 允许手动点击按钮触发编译

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          ref: coreelec-21-cpm # 确保拉取的是21版本分支

      - name: Cache Speed Up
        uses: actions/cache@v4
        with:
          path: |
            sources/
            build.CoreELEC-Amlogic-ng.arm-21/.threads/
            build.CoreELEC-Amlogic-ng.arm-21/.stamps/
          key: ${{ runner.os }}-coreelec-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-coreelec-

      - name: Free Disk Space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential bash bc bzip2 gcc g++ git patch xz-utils zip wget cpio python3 \
                                 xfonts-utils rdfind libparse-yapp-perl gperf xsltproc libxml-parser-perl patchutils lzop
      
      - name: Pre-download GMP archive
        run: |
          # 创建下载目录（请根据你的构建系统实际目录调整，这里以 dl 为例）
          mkdir -p dl
          # 从稳定的官方 GNU 镜像下载
          wget --user-agent="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36" \
               -O dl/gmp-6.3.0.tar.xz \
              https://ftp.gnu.org/gnu/gmp/gmp-6.3.0.tar.xz

      - name: Pre-download Zlib Archive
        run: |
          # 创建 CoreELEC 默认的源文件存放目录
          mkdir -p sources/zlib
          
          # 伪装成 Chrome 浏览器从更稳定的 GNU 或其他可靠镜像下载，若不行再冲官方
          # 这里提供两个几乎不会拦截的备用高可用链接：
          wget --user-agent="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36" \
               -O sources/zlib/zlib-1.3.1.tar.gz \
               https://zlib.net/fossils/zlib-1.3.1.tar.gz          

      - name: Pre-download WireGuard Linux Compat Archive
        run: |
          # 1. 创建 CoreELEC 默认的源文件存放目录
          mkdir -p sources/wireguard-linux-compat

          # 2. 从官方快照下载正确的文件，并存放到指定目录
          wget --user-agent="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36" \
               -O sources/wireguard-linux-compat/wireguard-linux-compat-1.0.20220627.tar.xz \
              https://git.zx2c4.com/wireguard-linux-compat/snapshot/wireguard-linux-compat-1.0.20220627.tar.xz

      - name: Pre-download WireGuard Tool  Archive
        run: |
          # 1. 创建 CoreELEC 默认的源文件存放目录
          mkdir -p sources/wireguard-tools

          # 2. 从官方快照下载正确的文件，并存放到指定目录
          wget --user-agent="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36" \
               -O sources/wireguard-tools/wireguard-tools-1.0.20210914.tar.xz \
              https://git.zx2c4.com/wireguard-tools/snapshot/wireguard-tools-v1.0.20210914.tar.xz  

      - name: Run CoreELEC Builder
        run: |
          PROJECT=Amlogic-ce DEVICE=Amlogic-ng ARCH=aarch64 make image

      - name: Upload Image Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CoreELEC-S922X-AV3A-Built
          path: target/*.img.gz
